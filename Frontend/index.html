<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Scam Reporting Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>UPI Scam Reporting Portal</h1>

    <h2>Report a Fraud</h2>

    <form id="fraudForm">

        <label>Reporter Name:</label>
        <input type="text" id="reporterName" required>
        <br><br>

        <label>Contact Number:</label>
        <input type="text" id="contact" maxlength="10" pattern="[0-9]{10}" required>
        <br><br>

        <label>Incident Date:</label>
        <input type="date" id="incidentDate" required>
        <br><br>

        <label>Transaction ID:</label>
        <input type="text" id="transactionId" maxlength="10" pattern="[0-9]{10}" required>
        <br><br>

        <label>Amount Involved:</label>
        <input type="number" id="amount" required>
        <br><br>

        <label>Type of Incident:</label>
        <select id="incidentType" required>
            <option value="">Select Type</option>
            <option value="UPI Scam">UPI Scam</option>
            <option value="Phishing">Phishing</option>
            <option value="Fake Customer Care">Fake Customer Care</option>
            <option value="Fraudulent Transaction">Fraudulent Transaction</option>
            <option value="Other">Other</option>
        </select>
        <br><br>

        <label>Description:</label>
        <br>
        <textarea id="description" required></textarea>
        <br><br>

        <label>Additional Information:</label>
        <br>
        <textarea id="additionalInfo"></textarea>
        <br><br>

        <button type="submit">Submit Report</button>

    </form>

<h2>Submitted Fraud Reports</h2>

<input
    type="text"
    id="searchInput"
    placeholder="Search by name or transaction ID"
>

<div id="reports"></div>

<script src="script.js"></script>

</body>
</html>
